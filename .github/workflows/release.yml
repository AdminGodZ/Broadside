name: Release

# Push a tag that matches the workspace version (vX.Y.Z) to publish a GitHub
# release with the CLI for each platform and the browser game as one HTML file.
# The website links to releases/latest/download/<file>, so file names carry no version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Version and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml version
        run: |
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi
      - run: rustup toolchain install
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

  cli:
    name: CLI ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # .cargo/config.toml builds for the local CPU; downloads must run on any CPU of their
          # kind, so RUSTFLAGS (which takes precedence) names a portable baseline instead.
          # x86-64-v2 includes POPCNT and SSE4.2 (any x86-64 CPU from about 2009 on).
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, cpu: x86-64-v2 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, cpu: generic }
          - { os: macos-latest, target: aarch64-apple-darwin, cpu: apple-m1 }
          - { os: macos-latest, target: x86_64-apple-darwin, cpu: x86-64-v2 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, cpu: x86-64-v2 }
    env:
      RUSTFLAGS: -C target-cpu=${{ matrix.cpu }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked -p broadside --target ${{ matrix.target }}
      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        run: |
          dir=broadside-${{ matrix.target }}
          mkdir "$dir"
          cp target/${{ matrix.target }}/release/broadside README.md LICENSE "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "broadside-${{ matrix.target }}"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/${{ matrix.target }}/release/broadside.exe, README.md, LICENSE $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: broadside-${{ matrix.target }}.*
          if-no-files-found: error

  web:
    name: Browser game
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: rustup toolchain install
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: site/dist/broadside.html
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [cli, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > ../SHA256SUMS.txt && mv ../SHA256SUMS.txt . && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Broadside $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
