[workspace]
resolver = "3"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Speed is the point of this project: squeeze everything out of release builds.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only" # keeps profiler output readable
