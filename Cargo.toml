[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Speed is the point of this project: squeeze everything out of release builds.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only" # keeps profiler output readable

# The browser build (`--profile wasm --target wasm32-unknown-unknown`): small download.
[profile.wasm]
inherits = "release"
debug = false
strip = true
